site_name: 逸工作室
site_description: 科技与数据学院 · 以赛促学创新实践社团 | ICPC实验室
site_author: YI-studio Team
site_url: https://yi-studio-icpc.github.io/yi-studio-icpc/
copyright: Copyright &copy; 2026 逸工作室 · 以赛促学 · 智创未来

nav:
  - 首页: index.md
  - 社团概览:
    - 关于我们: about/intro.md
    - 部门架构: about/teams.md
  - 竞赛中心:
    - 算法竞赛: algorithm/index.md
    - 训练手册: algorithm/train.md
  - 通知公告:
    - 纳新公告: notice/new_in.md
  - 加入我们: join.md

theme:
  name: material
  language: zh
  static_templates:
    - 404.html
  logo: assets/logo.svg
  favicon: assets/favicon.ico
  icon:
    logo: material/code-tags
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: deep-purple
      toggle:
        icon: material/brightness-7
        name: 切换至深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: deep-purple
      toggle:
        icon: material/brightness-4
        name: 切换至浅色模式
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.tabs.link
  font:
    text: 'Noto Sans SC'
    code: 'JetBrains Mono'

plugins:
  - search:
      lang: zh
      separator: '[\s\u200b\-_,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'

markdown_extensions:
  - admonition
  - def_list
  - footnotes
  - meta
  - toc:
      permalink: true
      slugify: !!python/name:pymdownx.slugs.uslugify
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_generator: !!python/name:pymdownx.emoji.to_svg
  - pymdownx.highlight:
      linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink
  - pymdownx.mark
  - pymdownx.snippets
  - pymdownx.progressbar
  - pymdownx.smartsymbols
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.grid
  - pymdownx.blocks.caption

extra:
  social:
    - icon: material/github
      link: https://github.com/yi-studio-icpc
      name: GitHub
  copyright: '<a href="https://creativecommons.org/licenses/by-sa/4.0/deed.zh">CC BY-SA 4.0</a>'
  generator: false

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/extra.js